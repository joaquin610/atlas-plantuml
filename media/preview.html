<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="{{csp}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantUML Preview</title>
    <link rel="stylesheet" href="{{styleUri}}">
</head>

<body>
    <div class="toolbar">
        <!-- View and zoom -->
        <button id="viewSource" title="View source code (Ctrl+T)">Source</button>
        <button id="reloadButton" class="icon-button" title="Reload diagram">&#x21bb;</button>
        <div class="separator"></div>
        <div class="group">
            <button id="zoomOut" class="icon-button" title="Zoom out">&minus;</button>
            <span id="zoomLevel" class="zoom-level" title="Zoom level">100%</span>
            <button id="zoomIn" class="icon-button" title="Zoom in">+</button>
        </div>
        <div class="group">
            <button id="zoomReset" title="Fit to window">Fit</button>
            <button id="zoomActual" title="Actual size (100%)">1:1</button>
        </div>
        <span id="selectionCounter" class="label" style="padding: 0 4px; display: none;"></span>
        <div class="separator"></div>
        <!-- Search -->
        <div class="search-box">
            <input id="searchInput" type="text" placeholder="Find class (Ctrl+F)" title="Enter: next, Shift+Enter: previous, Esc: clear" aria-label="Find in diagram" spellcheck="false">
            <span id="searchCount"></span>
            <button id="searchPrev" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>&#x2191;</button>
            <button id="searchNext" title="Next match (Enter)" aria-label="Next match" disabled>&#x2193;</button>
        </div>
        <div class="spacer"></div>
        <!-- Display options -->
        <button id="arrangeButton" title="Find a more readable order for the boxes and preview it before applying">Arrange</button>
        <label for="layoutSelect" class="label">Layout</label>
        <select id="layoutSelect" title="Diagram layout"></select>
        <button id="darkModeButton" title="Toggle dark mode">Dark</button>
        <button id="minimapButton" title="Show/hide minimap">Map</button>
        <button id="toggleJourneysButton" title="Show/hide Journeys panel">Journeys</button>
        <div class="separator"></div>
        <select id="exportSelect" title="Export the diagram as shown" aria-label="Export">
            <option value="">Export&hellip;</option>
            <option value="png">PNG image</option>
            <option value="svg">SVG image</option>
        </select>
        <!-- Arrange preview (shown while a candidate layout is previewed) -->
        <div class="arrange-bar" id="arrangeBar">
            <span class="label">Arranged layout preview</span>
            <select id="arrangeSelect" aria-label="Arranged layout option"></select>
            <span id="arrangeBaseline" class="label"></span>
            <div class="spacer"></div>
            <button id="arrangeApply" class="active" title="Write this order to the .puml file (undo with Ctrl+Z)">Apply</button>
            <button id="arrangeDiscard" title="Back to the current layout">Discard</button>
        </div>
    </div>
    <div class="content-area">
        <div class="preview-container active" id="previewContainer">
            <div class="svg-wrapper" id="svgWrapper">
                {{svg}}
            </div>
            <div class="rectangle-selection" id="rectangleSelection" style="display: none;"></div>
            <div id="minimap" title="Click or drag to move the view">
                <canvas id="minimapCanvas"></canvas>
                <div id="minimapView"></div>
            </div>
        </div>
    </div>
    <div class="input-container" id="inputContainer">
        <textarea id="journeyInput" placeholder="Enter rename/comment text..." rows="3"></textarea>
    </div>
    <div class="journey-sidebar" id="journeySidebar">
        <div class="journey-header">
            <span class="journey-header-title">Journeys (<span id="journeyCount">0</span>)</span>
            <div class="journey-header-buttons">
                <button class="journey-header-button" id="clipboardButton">clipboard</button>
                <button class="journey-header-button" id="resetButton">reset</button>
                <button class="journey-header-button" id="closeJourneysButton" title="Hide Journeys panel">&times;</button>
            </div>
        </div>
        <div class="journey-list" id="journeyList"></div>
    </div>
    <script id="previewInit" type="application/json">{{init}}</script>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>

</html>
