name: Setup toolchain
description: Node, pnpm, Java and dependencies for building and testing the extension.

runs:
  using: composite
  steps:
    # pnpm/action-setup fails if a version is passed while package.json also pins
    # packageManager, so only pass one when the manifest does not.
    - id: pnpm-version
      shell: bash
      run: |
        if node -e "process.exit(require('./package.json').packageManager ? 0 : 1)"; then
          echo "version=" >> "$GITHUB_OUTPUT"
        else
          echo "version=11" >> "$GITHUB_OUTPUT"
        fi

    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 24
        cache: pnpm

    # PlantUML tests run the real jar.
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: 21

    - shell: bash
      run: pnpm install --frozen-lockfile
